<!DOCTYPE html>
<html>
<head>
<style>
body {
    background: linear-gradient(135deg, #bdefff, #ffd6ec);
    min-height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
    transition: background 1s;
}

h1 {
    margin-top: 80px;
    animation: float 2s ease-in-out infinite;
}

#text {
    font-size: 18px;
}

button {
    display: block;
    margin: 35px auto;
    padding: 15px 28px;
    font-size: 20px;
    font-weight: bold;
    color: white;
    background: linear-gradient(135deg, #ff69b4, #ff1493);
    border: none;
    border-radius: 30px;
    box-shadow: 0 6px 15px #ff69b466;
    cursor: pointer;
    animation: pulse 1.8s infinite;
}

button:active {
    transform: scale(0.9);
}

#heartBox {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: white;
    padding: 25px 35px;
    border-radius: 25px;
    box-shadow: 0 10px 30px #888;
    animation: pop 0.5s forwards;
    z-index: 10;
}

#heartBox .heart {
    font-size: 80px;
    animation: beat 1s infinite;
}

.flyingHeart {
    position: fixed;
    font-size: 25px;
    animation: fly 2s linear forwards;
}

@keyframes pulse {
    50% { transform: scale(1.05); }
}

@keyframes float {
    50% { transform: translateY(-8px); }
}

@keyframes pop {
    to { transform: translate(-50%, -50%) scale(1); }
}

@keyframes beat {
    50% { transform: scale(1.2); }
}

@keyframes fly {
    from {
        transform: translateY(0);
        opacity: 1;
    }
    to {
        transform: translateY(-500px);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>Welcome bạn bạn 👋</h1>

<p id="text">Đây là Web mình tự làm 😗</p>

<button onclick="hello()">💗 Bấm vào đây đi 😗</button>

<script>
function hello() {
    document.getElementById("text").innerText = "I love you 😗🫰";
    document.body.style.background =
        "linear-gradient(135deg, #ffd1e8, #ffb6c1)";

    document.getElementById("heartBox")?.remove();

    document.body.innerHTML += `
        <div id="heartBox">
            <div style="font-size:25px;">Tớ yêu cậu 😗</div>
            <div class="heart">❤️</div>
        </div>
    `;

    for (let i = 0; i < 15; i++) {
        let heart = document.createElement("div");
        heart.className = "flyingHeart";
        heart.innerText = "💗";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.bottom = "20px";
        heart.style.animationDelay = Math.random() * 0.8 + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 2500);
    }
}
</script>

</body>
</html>
